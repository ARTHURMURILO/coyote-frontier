- type: entity
  parent: BaseComputer
  id: CoyoteAICore
  name: VIGIL CORE
  description: >-
    A VIGIL (Vessel Intelligence & General Integration Layer) core unit. An experimental AI core based on the LLM API system (OpenAI compatible API) by the now bankrupt 'ClosedAI' and their partner 'MicroSloopy', this core gives the LLM all the tools to be able to interact with the world with features such as pointing, speaking, radio, logic channels, vision, descriptions, crew manifest, Story/politic books and other features allowing for your lonely ship to be less lonely! (quality will vary with LLM model used)
  components:
  - type: CoyoteAICore
  - type: Computer
    board: CoyoteAICoreCircuitboard
  - type: ApcPowerReceiver
    powerLoad: 50
  - type: ActiveRadio
    channels:
    - Common
    - Command
    - Engineering
    - Medical
    - Science
    - Security
    - Service
    - Supply
  - type: IntrinsicRadioTransmitter
    channels:
    - Common
    - Command
    - Engineering
    - Medical
    - Science
    - Security
    - Service
    - Supply
  - type: Speech
    speechVerb: Default
  - type: DeviceLinkSource
    ports:
    - ChannelOne
    - ChannelTwo
    - ChannelThree
    - ChannelFour
    - ChannelFive
    - ChannelSix
    - ChannelSeven
    - ChannelEight
    - ChannelNine
    - ChannelTen
  - type: Sprite
    sprite: Mobs/Silicon/station_ai.rsi
    layers:
    - state: base
    - state: ai_empty
      shader: unshaded
  - type: ActivatableUI
    key: enum.CoyoteAICoreUiKey.Config
  - type: UserInterface
    interfaces:
      enum.CoyoteAICoreUiKey.Config:
        type: CoyoteAIConfigBoundUserInterface
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak

- type: entity
  parent: BaseComputerCircuitboard
  id: CoyoteAICoreCircuitboard
  name: VIGIL CORE circuitboard
  description: A circuitboard for a VIGIL (Vessel Intelligence & General Integration Layer) core.
  components:
  - type: ComputerBoard
    prototype: CoyoteAICore
